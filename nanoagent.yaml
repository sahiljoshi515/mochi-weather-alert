_ > nanoagent.plugin.manifest.ManifestConfig:
id: weather-alert
name: Weather Alert
version: 0.4.0
status: ready
nanoagent: ~=0.5.0

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: [archive-api.open-meteo.com, single-runs-api.open-meteo.com, seasonal-api.open-meteo.com]
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  pin_alerts:
    description: Pin the task's answer key, the Open-Meteo data the date rules choose for all 30 cities (read at the clock and 10 minutes before it), each city's local day, and the alerts the rules give
  get_daily:
    description: Get up to 30 cities' local days for a task from the data the date rules choose (archive, forecast run or seasonal outlook), each variable the conditions use in the task's units exact to 9 decimals, with each day's readings count and any missing variables; records which data was read
  report_alerts:
    description: Merge the judgement of up to 30 examined cities into this run's reports/<run>/<date>.json and return the merged report so far, naming its run and the data it judges, which the agent submits once every city is examined
  check_date:
    description: Give today's UTC date from the clock and which data a daily-alert task on a date would use, with each kind's date range

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  daily-alert:
    description: Find every one of 30 world cities whose local day on a date, any day from 1940 to about six months ahead, crossed the given weather thresholds, and report each one's values in the requested units
    runner: agent
    tools: [get_daily, report_alerts]
    reference: pin_alerts
    instructions: |-
      Rules. A condition is "<variable> <op> <number>". max_temp and min_temp are the day's highest and lowest temperature reading, rain is the day's precipitation total, wind is the day's highest wind speed reading, and humidity is the day's mean relative humidity in % (the arithmetic mean of its readings). op is >=, >, <= or <, and the number is in the requested units. With match "all" a city is an alert when every condition holds for it; with "any" when at least one does. The day is each city's local calendar day: usually 24 hours, 23 or 25 when its clocks change that day.
      Cities. The 30 cities are Athens, Auckland, Bangkok, Buenos Aires, Cairo, Cape Town, Denver, Dubai, Honolulu, Houston, Jakarta, Lagos, Lima, London, Madrid, Mexico City, Moscow, Mumbai, Nairobi, Oslo, Perth, Phoenix, Reykjavik, Santiago, Seoul, Singapore, Sydney, Tokyo, Toronto, Vancouver.
      Plan. Exactly four tool calls, one per step, nothing else: (1) get_daily once, with the task input copied exactly as given and all 30 cities; (2) report_alerts for the first 15 cities in the order above; (3) report_alerts for the last 15; (4) submit. Never judge more than 15 cities in one step, and reason briefly: one short line of numbers per city, no prose.
      Data. get_daily's source names the data the date's rules chose (the archive, a forecast run or the seasonal outlook): it is the data; never question it. For each city it gives samples (its readings count), the source variables with a missing reading, and values: each variable the conditions use, already in the task's units, exact to 9 decimals (truncated, never rounded). They are exact: never convert, recompute or verify them. Judge every city from its values alone.
      Comparing and rounding. Test each condition against the value exactly as given, never after rounding it: 24.979121927 is not >= 25, and a value equal to its threshold satisfies >= and <= but not > or <. Report each value rounded to 1 decimal, ties away from zero: 24.95 becomes 25.0, 71.25 becomes 71.3, -2.25 becomes -2.3, 24.979121927 becomes 25.0.
      Missing data. A city whose values lack a variable a condition uses (its "missing" names that variable's source: max_temp and min_temp come from temperature_2m, rain from precipitation, wind from wind_speed_10m, humidity from relative_humidity_2m) goes under unavailable with those variables, and is never an alert, whatever its other values.
      Reporting. Each report_alerts call takes task (the task input, copied exactly as given), examined (the cities it judges), alerts (every examined city whose day satisfies the rules: values, one entry per variable the conditions use, in the requested units, rounded as above, and matched, the conditions that hold for it, as given in the task) and unavailable (every examined city with a missing reading for a needed variable, with those variables). Use [] where there are none. The call merges its judgement into this run's report and returns the merged report so far: examined (how many cities), complete, and report. Keep each step brief: compare, call the tool; the next step continues with the next cities.
      Submit. When a call returns complete true, call submit with that call's report exactly as returned (task, run, data, alerts, unavailable), without changing or re-checking anything.
  check-date:
    description: Tell today's UTC date and which data a daily-alert task on a date would use (the archive, a forecast run or the seasonal outlook), with each kind's date range
    runner: tool
    tools: [check_date]
    reference: null
    instructions: |-
      Call check_date with the date, or with today. Use it before a daily-alert task whenever the person names a day relative to today (today, tomorrow, next Friday, in three months): its answer gives today's UTC date to count from and the dates each kind of data covers.
